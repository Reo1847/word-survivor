<title>단어 서바이버</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{display:flex;align-items:center;justify-content:center}
/* 1140:694 비율을 유지하며 창 크기에 맞춰 확대/축소 */
#wrap{--u:6.4px;--ar:1.6427;position:relative;width:min(100vw,calc(100vh * var(--ar)));width:min(100vw,calc(100dvh * var(--ar)));aspect-ratio:var(--ar);background:#000}

/* 폰: 이동 조이스틱 / 필살기 버튼 / 전체화면 / 세로 화면 안내 */
#stick{position:absolute;display:none;z-index:3;border-radius:50%;background:rgba(255,255,255,.14);border:calc(.3 * var(--u)) solid rgba(255,255,255,.4);pointer-events:none}

@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
#pauseBtn,#exitBtn{position:absolute;display:none;left:calc(.8 * var(--u));bottom:calc(.8 * var(--u));z-index:4;width:calc(4 * var(--u));height:calc(4 * var(--u));font-size:calc(2.2 * var(--u));line-height:1;border:none;border-radius:calc(1 * var(--u));background:rgba(255,255,255,.2);color:#fff;cursor:pointer}

#pauseBtn:hover,#exitBtn:hover{background:rgba(255,255,255,.35)}
#fs{position:absolute;display:none;left:calc(7.8 * var(--u));top:calc(.6 * var(--u));z-index:5;width:calc(3 * var(--u));height:calc(3 * var(--u));font-size:calc(1.6 * var(--u));line-height:1;border:none;border-radius:calc(.8 * var(--u));background:rgba(255,255,255,.2);color:#fff;cursor:pointer}

@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
/* 터치 화면은 화면이 작아서 글자를 키움 */

.dot.on{background:#ffd23f}
.sbuy{background:#ffd23f;color:#333;font-weight:bold;font-size:calc(1.5 * var(--u));border-radius:calc(.9 * var(--u));padding:calc(.55 * var(--u)) calc(1.3 * var(--u));cursor:pointer;min-width:calc(8 * var(--u));text-align:center}
.sbuy.off{background:#666;color:#bbb;cursor:not-allowed}
.sbuy.done{background:#4dd0ff;cursor:default}
.wgrid{display:flex;flex-wrap:wrap;gap:calc(.6 * var(--u));justify-content:center;margin:calc(.5 * var(--u)) auto calc(.8 * var(--u));max-width:calc(78 * var(--u))}
.wchip{background:rgba(255,255,255,.14);border-radius:calc(1 * var(--u));padding:calc(.45 * var(--u)) calc(1.1 * var(--u));font-size:calc(1.4 * var(--u))}
.wchip[data-act]{cursor:pointer}

.btn.sm.alt{box-shadow:0 calc(.4 * var(--u)) 0 #aaa}
input,textarea{font-family:inherit;font-size:calc(1.8 * var(--u));padding:calc(.8 * var(--u)) calc(1.2 * var(--u));border-radius:calc(1 * var(--u));border:none;user-select:text}
.vadd{display:flex;gap:calc(1 * var(--u));justify-content:center;align-items:center;margin-bottom:calc(.6 * var(--u))}

.vrow b{width:calc(20 * var(--u))}.vrow span{flex:1}

<body>
<div id="wrap">
  <canvas id="game" width="1140" height="694"></canvas>
  <button id="voice" tabindex="-1" title="영어 발음 켜기/끄기 (V)">🗣️</button>
  <button id="snd" tabindex="-1" title="소리 켜기/끄기 (M)">🔊</button>
  <button id="fs" tabindex="-1" title="전체화면">⛶</button>
  <div id="stick"><div id="knob"></div></div>
  <div id="overlay"></div>
  <div id="ultBtn">💣</div>
  <button id="pauseBtn" tabindex="-1" title="일시정지 (P / Esc)">⏸</button>
  <button id="exitBtn" tabindex="-1" title="나가기">🚪</button>
</div>
<div id="rotate">📱<br>폰을 가로로 돌려 주세요</div>

<script>
/* =========================================================
 * 단어 서바이버 (뱀서류 + 영단어 암기)
 * 단일 파일: HTML + CSS + JS (외부 에셋 없음)
 * ========================================================= */

// ---------- 단어 데이터 ----------
// 기본 단어. 게임 시작 화면의 '단어장'에서 원하는 단어를 직접 추가/삭제할 수 있고,
// 브라우저(localStorage)에 저장되어 다음에 열어도 유지됩니다.
// 주의: 오답 보기를 만들려면 '서로 다른 뜻'이 최소 4개 이상 필요합니다.
const DEFAULT_WORDS = [
  { en: 'apple',  ko: '사과' },
  { en: 'dog',    ko: '강아지' },
  { en: 'book',   ko: '책' },
  { en: 'water',  ko: '물' },
  { en: 'school', ko: '학교' },
];
// ---------- 날짜 도우미 (브라우저 현지 날짜 기준, 형식 YYYY-MM-DD) ----------
const pad2 = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayStr = () => dstr(new Date());
const shiftDate = (str, n) => { const [y, m, d] = str.split('-').map(Number); return dstr(new Date(y, m - 1, d + n)); };
const isDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);

// 게임 모드(어느 날짜 범위의 단어장으로 플레이할지)
const MODES = {
  today: { icon: '📅', label: '오늘', desc: '오늘 등록한 단어', from: () => todayStr() },
  week:  { icon: '🗓️', label: '일주일', desc: '최근 7일 단어', from: () => shiftDate(todayStr(), -6) },
  month: { icon: '📆', label: '한 달', desc: '최근 30일 단어', from: () => shiftDate(todayStr(), -29) },
  all:   { icon: '📚', label: '전체', desc: '모든 단어장', from: () => '0000-00-00' },
};
const wordsFor = m => WORDS.filter(w => w.date >= MODES[m].from() && (m === 'all' || w.date <= todayStr()));

// ---------- 저장소(localStorage) 사용 가능한지 확인 ----------
// 카카오톡 등에서 content:// 주소로 열면 저장이 막힐 수 있어서, 그럴 땐 시작 화면에 알려줌
let STORAGE_OK = true;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { STORAGE_OK = false; }

// ---------- 한영키 자동 변환 ----------
// 단어장 입력칸: 영어 칸에 한글 자판(ㅁㄴㅇㄹ)으로 쳐도 영어로, 뜻 칸에 영어 자판으로 쳐도 한글로 바뀜 (두벌식 기준)
const H_CHO = ['r','R','s','e','E','f','a','q','Q','t','T','d','w','W','c','z','x','v','g'];
const H_JUNG = ['k','o','i','O','j','p','u','P','h','hk','ho','hl','y','n','nj','np','nl','b','m','ml','l'];
const H_JONG = ['','r','R','rt','s','sw','sg','e','f','fr','fa','fq','ft','fx','fv','fg','a','q','qt','t','T','d','w','c','z','x','v','g'];
const H_COMPAT = ['r','R','rt','s','sw','sg','e','E','f','fr','fa','fq','ft','fx','fv','fg','a','q','Q','qt','t','T','d','w','W','c','z','x','v','g'];   // ㄱ(3131)~ㅎ(314E)
const H_CHO_IDX = {}; H_CHO.forEach((k, i) => H_CHO_IDX[k] = i);
const H_JONG_IDX = {}; H_JONG.forEach((k, i) => { if (k.length === 1 && i) H_JONG_IDX[k] = i; });
const H_JONG_KEY = {}; for (const k in H_JONG_IDX) H_JONG_KEY[H_JONG_IDX[k]] = k;
const H_JONG_PAIR = {}; H_JONG.forEach((k, i) => { if (k.length === 2) H_JONG_PAIR[k] = i; });
const H_JUNG_PAIR = { hk: 9, ho: 10, hl: 11, nj: 14, np: 15, nl: 16, ml: 19 };

  if (Object.keys(META.learned).length < 600 || META.learned[k]) META.learned[k] = (META.learned[k] || 0) + 1;
  META.totalCorrect++;
  const t = todayStr();
  if (META.days[META.days.length - 1] !== t) { META.days.push(t); if (META.days.length > 800) META.days.shift(); }
  saveMeta();
}
function studyStreak() {   // 연속 학습일 (오늘 또는 어제까지 이어진 날수)
  const set = new Set(META.days);
  let d = todayStr(); if (!set.has(d)) d = shiftDate(d, -1);
  let n = 0; while (set.has(d)) { n++; d = shiftDate(d, -1); }
  return n;
}

function cleanGear(g) {   // 저장/가져오기 값을 안전하게 정리
  const r = { bag: [], eq: {}, next: 1 };

          !Number.isFinite(it.val) || !Number.isInteger(it.id) || it.id < 1 || ids.has(it.id)) continue;

    r.next = r.bag.reduce((m, x) => Math.max(m, x.id + 1), 1);

    if (!it) continue;

  const odds = BOSS_DROP_ODDS[Math.max(0, Math.min(BOSS_DROP_ODDS.length - 1, bossNo - 1))];
  let roll = Math.random() * 100, rar = 0;
  for (let i = 0; i < 4; i++) { if (roll < odds[i]) { rar = i; break; } roll -= odds[i]; }

function applyGear(init) {
  const g = calcGear(), p = G.player, add = g.hp - G.gearHp;
  G.gear = g; G.gearHp = g.hp;
  p.maxHp += add;
  p.hp = init ? p.maxHp : Math.min(p.maxHp, Math.max(1, p.hp + Math.max(0, add)));
  p.speed = B.player_speed * (1 + B.up_speed * G.speedLv) * (1 + g.speed);
}

// ---------- 문제 출제 ----------
function pickWord() {
  let w;
  do {
    if (deck.length === 0) deck = shuffle(pool().slice());
    w = deck.pop();
  } while (w === lastWord && pool().length > 1);  // 같은 단어 연속 출제 방지
  lastWord = w;
  return w;
}

function nextQuestion() {
  const w = pickWord();
  // 오답 3개: 다른 단어들의 뜻 중에서 무작위 선택
  // 절반(50%)은 거꾸로: 한글 뜻을 보여주고 영어 단어를 고르게 함
  const enKey = x => x.en.trim().toLowerCase();
  let revWrongs = shuffle(pool().filter(x => enKey(x) !== enKey(w) && x.ko !== w.ko)).slice(0, 3).map(x => x.en);
  if (revWrongs.length < 3) revWrongs = shuffle(pool().filter(x => enKey(x) !== enKey(w))).slice(0, 3).map(x => x.en);   // 뜻이 겹쳐도 영어만 다르면 허용
  const rev = Math.random() < 0.5 && revWrongs.length === 3;
  const wrongs = rev ? revWrongs : shuffle(pool().filter(x => x.ko !== w.ko)).slice(0, 3).map(x => x.ko);
  // 정답 구역: 현재 서 있는 구역을 포함해 4개 구역 중 완전 무작위 (연속으로 같은 구역이 나와도 됨)
  const correct = Math.floor(Math.random() * 4);
  const labels = [];
  let k = 0;
  for (let i = 0; i < 4; i++) labels[i] = (i === correct) ? (rev ? w.en : w.ko) : wrongs[k++];
  G.q = { word: w, rev, top: rev ? w.ko : w.en, bottom: rev ? w.en : w.ko, labels, correct, timeLeft: QUESTION_TIME, over: 0, done: false, feedback: 0, fbMax: 1, wasOver: false };
}

function hurt(n) {
  const p = G.player;
  if (G.god) return;   // 관리자 테스트: 무적
  p.hp -= n;
  G.texts.push({ x: p.x, y: p.y - 26, t: '-' + n, c: '#ff3b3b', life: 0.9 });
  if (p.hp <= 0) { p.hp = 0; gameOver(); }
}

  q.done = true;
  if (q.rev) speak(q.word.en);   // 한글 뜻 문제: 영어 정답을 맞히면 발음 들려주기
  // 정답 뒤 가운데에 '영어 + 뜻'을 잠깐 보여줌 (늦게 맞힌 경우엔 더 오래: 뭔지 모르고 넘어가지 않게)
  q.feedback = q.fbMax = q.wasOver ? 2.6 : 1.6;
  G.correct++;
  trackLearn(q.word);
  // 5초가 끝날 때 정답 구역에 있었으면(=제때 정답) 15XP, 늦게 도달했으면 10XP
  const fast = !q.wasOver;
  // 연속 정답(콤보): 제때 맞히면 +1, 늦게 맞히면 끊김. 콤보가 쌓일수록 XP 보너스(최대 +10)
  if (fast) { G.fast++; G.combo++; G.bestCombo = Math.max(G.bestCombo, G.combo); } else G.combo = 0;
  const gain = Math.round(((fast ? B.xp_fast : B.xp_late) + (fast ? Math.min(10, (G.combo - 1) * 2) : 0)) * (1 + G.gear.xp));
  G.xp += gain;
  sfx(fast ? 'ok' : 'late', G.combo);
  // 필살기 게이지: 제때 맞히면 +25, 늦게 맞히면 +10
  const gBefore = G.gauge;
  G.gauge = Math.min(100, G.gauge + (fast ? 25 : 10));
  if (gBefore < 100 && G.gauge >= 100) { G.banner = { t: '⚡ 필살기 준비 완료! 스페이스바!', life: 2.2 }; sfx('ready'); }
  if (!G.seen) G.seen = new Set();
  G.seen.add(q.word);
  if (q.wasOver) { G.late++; G.missed[q.word.en] = (G.missed[q.word.en] || 0) + 1; }
  const p = G.player;
  if (curChar().heal) p.hp = Math.min(p.maxHp, p.hp + curChar().heal);   // 요정사 패시브: 정답 시 체력 회복
  G.texts.push({ x: p.x, y: p.y - 30, t: (fast ? (G.combo >= 2 ? G.combo + '콤보! ' : '정답! ') : '늦은 정답 ') + '+' + gain + 'XP', c: '#1ba54a', life: 1.2 });
  if (G.correct % 10 === 0 && G.bossN < BOSS_GOAL) spawnBoss();   // 10문제 맞힐 때마다 중간 보스 등장
  if (G.xp >= G.xpNext) levelUp();
}

// ---------- 보스 장비 드롭 ----------
// 보스를 잡으면 장비 1개 (최종 보스는 2개). 빈 칸이면 바로 껴주고, 가방이 가득 차면 자동으로 별로 바꿈
function dropGear(n) {
  let msg = '';
  const count = G.bossKills >= BOSS_GOAL ? 1 + n : n;
  for (let i = 0; i < count; i++) {
    const it = rollGear(Math.max(1, Math.min(BOSS_GOAL, G.bossKills)));
    if (META.gear.bag.length >= BAG_MAX) { META.stars += RARITY[it.rar].sell; msg = '가방이 가득 차서 별로 바꿨어요'; continue; }
    META.gear.bag.push(it);
    G.drops.push(it);
    let eqd = false;
    if (!META.gear.eq[it.slot]) { META.gear.eq[it.slot] = it.id; eqd = true; }
    msg = '🎁 ' + GEAR_INFO[it.slot].icon + ' ' + gearName(it) + ' (' + RARITY[it.rar].name + ') ' + gearText(it.slot, it.val) + (eqd ? ' · 착용!' : '');
  }
  saveMeta();
  applyGear(false);
  if (G.drops.length) sfx('buy');
  return msg || '체력 회복 +20XP';
}

// ---------- 중간 보스 생성 ----------
function spawnBoss() {
  G.bossN++;
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = rand(100, W - 100); y = -50; }
  else if (side === 1) { x = W + 50; y = rand(100, H - 100); }
  else if (side === 2) { x = rand(100, W - 100); y = H + 50; }
  else { x = -50; y = rand(100, H - 100); }
  const last = G.bossN === BOSS_GOAL;                   // 마지막 5번째는 최종 보스
  const RKb = RANKS[G.rank || 0];
  const hp = Math.round((B.boss_hp + (G.bossN - 1) * B.boss_hpStep + G.level * B.boss_hpLevel) * (last ? B.boss_lastMul : 1) * RKb.hp);   // 보스가 나올수록 더 튼튼
  G.enemies.push({ x, y, r: 38 + 2 * G.bossN, flash: 0, orbCd: 0, boss: true, tier: G.bossN, hp, maxHp: hp, dmg: (B.boss_dmg + B.boss_dmgStep * (G.bossN - 1)) * RKb.dmg, speed: (B.boss_speed + G.bossN * B.boss_speedStep) * RKb.spd });
  sfx('boss');
  G.banner = { t: last ? '⚠ 최종 보스 등장!' : '⚠ 보스 ' + G.bossN + ' / ' + BOSS_GOAL + ' 등장!', life: 2.5 };
}

// ---------- 필살기: 단어 폭탄 (게이지가 가득 차면 스페이스바 / 화면 클릭) ----------
function fireUltimate() {
  if (state !== 'play' || !G || G.gauge < 100) return;
  G.gauge = 0;
  G.flash = 0.6;
  sfx('ult');
  for (const e of G.enemies) {
    if (e.boss) damageEnemy(e, e.maxHp * 0.3 + 40);   // 보스는 체력의 30% + 40
    else e.hp = 0;                                    // 일반 적은 모두 처치
  }
  G.banner = { t: '💣 단어 폭탄!', life: 1.6 };
}

// ---------- 레벨업: 게임 일시정지 + 업그레이드 선택창 ----------
function levelUp() {
  G.xp -= G.xpNext;
  G.level++;
  G.xpNext = B.xp_base + (G.level - 1) * B.xp_step;   // 10마리 보스 한 판에 약 11~16번 레벨업
  state = 'levelup';
  MOVE_KEYS_HELD().forEach(k => blockKeys.add(k));   // 누르고 있던 방향키는 한 번 뗐다 눌러야 반응
  keys = {}; TOUCH.x = TOUCH.y = 0;
  sfx('levelup');
  showLevelCards();
}

// 카드 3장 뽑기: 진화 카드는 항상 맨 앞, 이미 가진 능력은 3배 더 자주, 무기는 최대 MAX_WEAPONS개까지만
function pickCards() {
  const avail = UPS.filter(u => u.lv() < u.max && (!u.cond || u.cond()));
  const evos = avail.filter(u => u.evo).slice(0, 3);
  const ownedWeapons = WEAPON_IDS.filter(id => G.weapons[id] > 0).length;
  const pool = avail.filter(u => !u.evo && !(WEAPON_IDS.includes(u.id) && G.weapons[u.id] === 0 && ownedWeapons >= MAX_WEAPONS));
  const picks = [];
  while (picks.length < 3 - evos.length && pool.length) {
    const w = pool.map(u => (u.lv() > 0 ? 3 : 1));
    let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
    while (i < pool.length - 1 && (r -= w[i]) >= 0) i++;
    picks.push(pool.splice(i, 1)[0]);
  }
  return [...evos, ...picks];
}

function showLevelCards() {
  const picks = pickCards();
  upCount = picks.length; upSel = 0; upShownAt = performance.now();
  let html = '<div class="panel"><h2>🎉 레벨 업! Lv.' + G.level + '</h2><p>' + (IS_COARSE ? '강화할 능력을 <b>손가락으로 눌러</b> 선택하세요' : '마우스로 클릭하거나, <b>A / D</b>로 고르고 <b>스페이스바</b>로 선택하세요') + '</p><div class="cards">';
  picks.forEach((u, i) => {
    const l = u.lv();
    const tag = u.tag || ((u.max === Infinity) ? '' : (l === 0 ? 'NEW!' : 'Lv.' + l + ' → Lv.' + (l + 1)));
    html += '<div class="card' + (i === 0 ? ' sel' : '') + '" data-act="up" data-idx="' + i + '" data-id="' + u.id + '"><div class="ic">' + u.icon + '</div>' +
            '<div class="nm">' + u.name + '</div><div class="lv">' + tag + '</div><div class="ds">' + u.desc + '</div></div>';
  });
  html += '</div><div class="btns" style="margin-top:calc(2 * var(--u))"><div class="btn sm alt' + (G.rerolls > 0 ? '' : ' off') + '" data-act="reroll">🔄 다시 뽑기' + (IS_COARSE ? '' : ' (R)') + ' · 남은 ' + G.rerolls + '번</div></div></div>';
  showOverlay(html);
}
function doReroll() {
  if (state !== 'levelup' || G.rerolls <= 0) return;
  G.rerolls--;
  sfx('pick');
  showLevelCards();
}

// ---------- 게임 오버 ----------
function gameOver() { finishRun(false); }

// 한 판이 끝났을 때(실패/클리어 공통): 별 지급 + 결과 화면

    '<div class="stars">⭐ +' + parts + ' 획득!  (보유 ' + META.stars + ')</div>' + rkMsg +
    (G.drops.length ? '<div class="list" style="text-align:left;max-height:calc(12 * var(--u));overflow-y:auto">🎁 이번에 얻은 장비 (🎒 장비에서 바꿔 낄 수 있어요)<br>' + G.drops.map(gearHtml).join('<br>') + '</div>' : '') +
    list + '<div class="btns">' + (G.tested ? '' : '<div class="btn" data-act="test">📝 단어 시험 (만점이면 보상!)</div>') + '<div class="btn' + (G.tested ? '' : ' alt') + '" data-act="replay">다시 도전!</div><div class="btn alt" data-act="shop">⭐ 성장 상점</div><div class="btn alt" data-act="gear">🎒 장비</div><div class="btn alt" data-act="title">처음으로</div></div>' + KEYHINT + '</div>');

// ---------- 단어 시험: 이번 판에 나온 단어로 10문제 (4지선다), 만점이면 보상 ----------
let TEST = null;
const TEST_N = 10;
function makeQuiz(w) {   // 영어→뜻 또는 뜻→영어 (절반씩), 보기 4개
  const enKey = x => x.en.trim().toLowerCase();
  const revWrongs = shuffle(pool().filter(x => enKey(x) !== enKey(w) && x.ko !== w.ko)).slice(0, 3).map(x => x.en);
  const rev = Math.random() < 0.5 && revWrongs.length === 3;
  const wrongs = rev ? revWrongs : shuffle(pool().filter(x => x.ko !== w.ko)).slice(0, 3).map(x => x.ko);
  const correct = Math.floor(Math.random() * 4), labels = [];
  let k = 0;
  for (let i = 0; i < 4; i++) labels[i] = i === correct ? (rev ? w.en : w.ko) : wrongs[k++];
  return { word: w, rev, labels, correct };
}
function startTest() {
  // 이번 판에 나온 단어 중 늦게 맞힌(어려웠던) 단어를 먼저, 나머지는 무작위. 10개가 안 되면 단어장의 다른 단어로 채움
  let words = shuffle(Array.from(G.seen || []));
  words.sort((a, b) => (G.missed[b.en] || 0) - (G.missed[a.en] || 0));
  words = words.slice(0, TEST_N);
  if (words.length < TEST_N) words.push(...shuffle(pool().filter(w => !words.includes(w))).slice(0, TEST_N - words.length));
  TEST = { qs: shuffle(words).map(makeQuiz), i: 0, score: 0, wrong: [], locked: false };
  G.tested = true;
  state = 'test'; keys = {};
  showTestQ();
}
function showTestQ() {
  const q = TEST.qs[TEST.i], n = TEST.qs.length;
  const top = q.rev ? q.word.ko : q.word.en;
  let btns = '';
  q.labels.forEach((l, k) => { btns += '<div class="btn alt" style="display:block;min-width:calc(26 * var(--u));font-size:calc(2.6 * var(--u))" data-act="t-ans" data-i="' + k + '">' + (k + 1) + '. ' + esc(l) + '</div>'; });
  showOverlay('<div class="panel"><h2>📝 단어 시험 ' + (TEST.i + 1) + ' / ' + n + '</h2>' +
    '<div class="stars">맞힌 개수 ' + TEST.score + '</div>' +
    '<p style="font-size:calc(5 * var(--u));font-weight:bold;margin:calc(1 * var(--u)) 0 0">' + esc(top) + '</p>' +
    '<p>' + (q.rev ? '알맞은 영어 단어를 고르세요' : '알맞은 뜻을 고르세요') + '</p>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:calc(1.4 * var(--u));justify-items:center;max-width:calc(62 * var(--u));margin:0 auto">' + btns + '</div>' +
    '<p id="t-fb" style="min-height:calc(3 * var(--u));margin-top:calc(1.2 * var(--u));font-weight:bold"></p>' +
    '<p class="hint">숫자 1~4 키 · 또는 W A S D / 방향키로 고르고 스페이스바 · 마우스 클릭</p></div>');
}
function answerTest(i) {
  if (state !== 'test' || !TEST || TEST.locked) return;
  const q = TEST.qs[TEST.i];
  if (!(i >= 0 && i < 4)) return;
  TEST.locked = true;
  const ok = i === q.correct;
  if (ok) TEST.score++; else TEST.wrong.push(q.word);
  sfx(ok ? 'ok' : 'error');
  const els = overlay.querySelectorAll('[data-act="t-ans"]');
  if (els[q.correct]) { els[q.correct].style.background = '#2ecc71'; els[q.correct].style.color = '#fff'; }
  if (!ok && els[i]) { els[i].style.background = '#ff6b6b'; els[i].style.color = '#fff'; }
  const fb = document.getElementById('t-fb');
  if (fb) { fb.style.color = ok ? '#7CFC7C' : '#ffb3b3'; fb.textContent = (ok ? '정답! ' : '아쉬워요. ') + q.word.en + ' = ' + q.word.ko; }
  speak(q.word.en);
  const idx = TEST.i;
  setTimeout(() => {
    if (state !== 'test' || !TEST || TEST.i !== idx) return;
    TEST.i++; TEST.locked = false;
    if (TEST.i < TEST.qs.length) showTestQ(); else finishTest();
  }, ok ? 1100 : 1900);
}
function finishTest() {
  const n = TEST.qs.length, perfect = TEST.score === n;
  state = G.win ? 'clear' : 'over';
  let reward = '';
  if (perfect) {   // 만점 보상: 별 + (10문제일 때) 좋은 장비 1개
    const stars = 5 * n; META.stars += stars; reward = '⭐ +' + stars;
    if (n >= TEST_N) {
      const it = rollGear(7);
      if (META.gear.bag.length >= BAG_MAX) { META.stars += RARITY[it.rar].sell; reward += ' · 가방이 가득 차서 장비는 ⭐' + RARITY[it.rar].sell + '로 바뀌었어요'; }
      else { META.gear.bag.push(it); if (!META.gear.eq[it.slot]) META.gear.eq[it.slot] = it.id; reward += '<br>🎁 ' + gearHtml(it); }
    }
    saveMeta(); sfx('clear');
  } else sfx('over');
  const wrong = TEST.wrong.length ? '<p>다시 복습해요!</p><div class="list" style="max-height:calc(14 * var(--u));overflow-y:auto">' + TEST.wrong.map(w => '<b>' + esc(w.en) + '</b> = ' + esc(w.ko)).join('<br>') + '</div>' : '';
  showOverlay('<div class="panel"><h2>' + (perfect ? '💯 만점!' : '📝 시험 끝!') + '</h2>' +
    '<div class="stars">' + TEST.score + ' / ' + n + '점</div>' +
    (perfect ? '<div class="list">🎉 보상 획득!<br>' + reward + '</div>' : '<p>만점을 받으면 보상이 있어요. 다음엔 만점에 도전!</p>') +
    wrong +
    '<div class="btns"><div class="btn" data-act="replay">다시 도전!</div><div class="btn alt" data-act="shop">⭐ 성장 상점</div><div class="btn alt" data-act="gear">🎒 장비</div><div class="btn alt" data-act="title">처음으로</div></div>' + KEYHINT + '</div>');
}

// ---------- 오버레이(DOM) 도우미 ----------
// ---------- 메뉴 키보드 조작 (시작/상점/단어장/결과 화면): W/A/S/D(또는 방향키)로 이동, Space/Enter로 선택 ----------
let kfEl = null, overlayShownAt = 0;
const KEYHINT = '<p class="hint">⌨ 이동: W A S D 또는 방향키  ·  선택: 스페이스바 / Enter  ·  소리 M · 발음 V · 다시 듣기 F</p>';
const kfKey = el => [el.dataset.act, el.dataset.id, el.dataset.mode, el.dataset.i].join('|');
const menuItems = () => Array.from(overlay.querySelectorAll('[data-act]')).filter(el => el.dataset.act !== 'noplay');
function markKf() {
  overlay.querySelectorAll('.kf').forEach(el => el.classList.remove('kf'));
  if (kfEl) { kfEl.classList.add('kf'); if (kfEl.scrollIntoView) kfEl.scrollIntoView({ block: 'nearest' }); }
}
var onTitle = false;   // 지금 시작 화면이 떠 있는지
function showOverlay(html) {
  const prev = kfEl ? kfKey(kfEl) : null;           // 화면을 다시 그려도(예: 구입 후) 선택 위치를 유지
  onTitle = false; overlay.innerHTML = html; overlay.classList.add('show');
  overlay.classList.toggle('solid', state !== 'paused' && state !== 'levelup');   // 시작·메뉴 화면은 깔끔한 단색 배경 (게임 화면이 비치지 않게)
  overlayShownAt = performance.now();
  kfEl = null;
  if (state !== 'levelup') {                         // 레벨업 카드는 별도 방식(A/D + 스페이스)
    const items = menuItems();
    kfEl = items.find(el => kfKey(el) === prev) || items[0] || null;
    markKf();
  }
}
function moveFocus(dir) {
  const items = menuItems();
  if (!items.length) return;
  const cur = items.includes(kfEl) ? kfEl : items[0];
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bs = 1e9;
  for (const el of items) {
    if (el === cur) continue;
    const q = el.getBoundingClientRect(), dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;

function menuKey(e) {

  const now = performance.now();

    e.preventDefault();

    if (!e.repeat && now - overlayShownAt > 350) moveFocus(dir);

  }
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    // 필살기를 누르다 죽었을 때 바로 '다시 도전'이 눌리는 실수 방지
    if (e.repeat || now - overlayShownAt < 600) return true;
    const items = menuItems();
    const cur = items.includes(kfEl) ? kfEl : items[0];

  }

}

// ---------- 백업 / 다른 기기로 옮기기 (파일 또는 코드) ----------
const SAVE_APP = 'word-survivor';
const UNDO_KEY = 'wordSurvivorUndo';
function buildSave() {
  return { app: SAVE_APP, v: 1, at: new Date().toISOString(), words: WORDS.map(w => ({ en: w.en, ko: w.ko, date: w.date })), meta: META, balance: balDiff() };
}
function cleanWords(arr) {   // 가져온 단어를 안전하게 정리 (길이 제한, 중복 제거, 날짜 확인)
  const seen = new Set(), out = [];
  for (const w of (Array.isArray(arr) ? arr : [])) {
    if (!w || typeof w.en !== 'string' || typeof w.ko !== 'string') continue;
    const en = w.en.trim().slice(0, 24), ko = w.ko.trim().slice(0, 20);
    if (!en || !ko) continue;
    const k = en.toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k);
    out.push({ en, ko, date: isDate(w.date) ? w.date : todayStr() });
    if (out.length >= 500) break;
  }
  return out;
}
function cleanMeta(m) {      // 가져온 별/성장 기록 정리 (허용 범위 밖의 값은 잘라냄)
  const r = { stars: 0, hp: 0, armor: 0, mastery: 0, reroll: 0, gauge: 0, unlocked: { bolt: true }, start: '', clears: 0, bestBoss: 0, gear: cleanGear(m && m.gear), chars: { mage: true }, char: 'mage', ...cleanProfile(m) };
  if (m && typeof m === 'object') {
    if (Number.isFinite(m.stars)) r.stars = Math.max(0, Math.min(999999, Math.floor(m.stars)));
    for (const it of SHOP_ITEMS) if (Number.isFinite(m[it.id])) r[it.id] = Math.max(0, Math.min(it.max, Math.floor(m[it.id])));
    for (const k of ['clears', 'bestBoss']) if (Number.isFinite(m[k])) r[k] = Math.max(0, Math.min(9999, Math.floor(m[k])));
    if (m.unlocked && typeof m.unlocked === 'object') for (const id of WEAPON_IDS) if (m.unlocked[id] === true) r.unlocked[id] = true;
    if (typeof m.start === 'string' && r.unlocked[m.start] && m.start !== 'bolt') r.start = m.start;
    const cc = cleanChars(m.chars, m.char); r.chars = cc.owned; r.char = cc.sel;
  }
  return r;
}
function parseSave(text) {
  let o;
  try { o = JSON.parse(String(text).trim()); } catch (e) { return { error: '저장 내용을 읽을 수 없어요. 파일이나 코드가 맞는지 확인해 주세요.' }; }
  if (!o || o.app !== SAVE_APP || !Array.isArray(o.words)) return { error: '단어 서바이버 저장 파일이 아니에요.' };
  return { words: cleanWords(o.words), meta: cleanMeta(o.meta), balance: cleanBalance(o.balance) };
}
// mode: 'overwrite' = 이 기기 기록을 전부 파일 내용으로 바꿈 / 'merge' = 단어만 합치기(별·성장은 그대로)
function applySave(parsed, mode) {
  try { localStorage.setItem(UNDO_KEY, JSON.stringify(buildSave())); } catch (e) {}   // 되돌리기용 백업
  if (mode === 'overwrite') {
    WORDS = parsed.words; META = parsed.meta;
    saveMeta(); saveWords(); setBalance(parsed.balance);   // 관리자가 바꾼 수치도 함께 적용
    return { added: parsed.words.length, had: 0 };
  }
  let added = 0, had = 0;
  const have = new Set(WORDS.map(w => w.en.toLowerCase()));
  for (const w of parsed.words) {

const SPELL_OK_KEY = 'wordSurvivorSpellOk';   // 선생님/아이가 "맞아요"로 확인한 단어(다시 묻지 않음)
let SPELL_OK = new Set(); try { SPELL_OK = new Set(JSON.parse(localStorage.getItem(SPELL_OK_KEY) || '[]')); } catch (e) {}
function rememberSpell(en) { SPELL_OK.add(en.toLowerCase()); try { localStorage.setItem(SPELL_OK_KEY, JSON.stringify([...SPELL_OK].slice(-800))); } catch (e) {} }
function knownToken(t) {
  if (t.length <= 1 || SPELL_DICT.has(t) || SPELL_OK.has(t)) return true;
  // 복수형/과거형/ing/ly/er/est 같은 꼬리를 떼고 다시 확인
  for (const suf of ['s', 'es', 'ed', 'd', 'ing', 'ly', 'er', 'est', 'r', 'st', 'ily', 'ier', 'iest', 'ied', 'ies', 'y']) {
    if (t.length <= suf.length + 1 || !t.endsWith(suf)) continue;
    const st = t.slice(0, -suf.length), c = [st, st + 'e'];
    if (suf[0] === 'i' && suf !== 'ing') c.push(st + 'y');   // happily→happy, studied→study (studing은 오타)
    if (st.length > 2 && st[st.length - 1] === st[st.length - 2]) c.push(st.slice(0, -1));   // running → run
    if (c.some(x => SPELL_DICT.has(x))) return true;
  }
  return false;
}
function editDist(a, b, max) {   // 글자 하나 틀림/빠짐/더함/자리바뀜을 1로 세는 거리
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const d = [];
  for (let i = 0; i <= a.length; i++) { d[i] = [i]; }
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}
function spellSuggest(t) {
  const max = t.length <= 4 ? 1 : 2, out = [];
  for (const w of SPELL_DICT) { if (Math.abs(w.length - t.length) > max) continue; const d = editDist(t, w, max); if (d <= max) out.push([d, Math.abs(w.length - t.length), w]); }
  out.sort((x, y) => x[0] - y[0] || x[1] - y[1] || (x[2] < y[2] ? -1 : 1));
  return out.slice(0, 3).map(x => x[2]);
}
// 오타 같으면 { bad: 의심 단어, sugg: [추천 전체 문장들] }, 괜찮으면 null
function spellCheck(en) {
  const toks = en.toLowerCase().split(/[\s\-]+/).filter(Boolean);
  for (const raw of toks) {
    if (/[^a-z]/.test(raw.replace(/'/g, '')) || raw.includes("'")) continue;   // 숫자·기호가 섞이면 검사 안 함
    if (knownToken(raw)) continue;
    const sg = spellSuggest(raw).map(w => en.replace(new RegExp(raw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), w));
    return { bad: raw, sugg: sg };
  }
  return null;
}

// 단어 한 개 추가. 같은 영어 단어가 이미 있으면(어느 날짜든) 뜻만 수정
function addWord(en, ko, date) {
  en = en.trim(); ko = ko.trim();
  const same = WORDS.find(w => w.en.toLowerCase() === en.toLowerCase());
  if (same) { same.ko = ko; return '수정'; }
  if (WORDS.length >= 500) return '가득';
  WORDS.push({ en, ko, date });
  return '추가';
}

// 고른 범위의 단어로 게임 시작
function startGame(mode) {
  lastMode = mode;
  PLAY = wordsFor(mode);
  if (distinct(PLAY) < 4) { showModes(); return; }
  deck = []; lastWord = null;
  fitLayout();   // 현재 화면 비율에 맞춰 플레이 영역 확장
  newGame();
  hideOverlay();
  state = 'play';
  sayQuestion();
}

  knobEl.style.transform = 'translate(' + vx + 'px,' + vy + 'px)';
}
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch') { fireUltimate(); return; }   // 마우스 클릭 = 필살기, 터치 = 이동 조이스틱
  touchUI = true;
  if (state !== 'play' || TOUCH.id !== null) return;
  TOUCH.id = e.pointerId; TOUCH.ox = e.clientX; TOUCH.oy = e.clientY; TOUCH.x = TOUCH.y = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  drawStick(e.clientX, e.clientY, 0, 0, wrapEl.getBoundingClientRect().height * 0.115);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== TOUCH.id) return;
  const R = wrapEl.getBoundingClientRect().height * 0.115;
  let vx = e.clientX - TOUCH.ox, vy = e.clientY - TOUCH.oy;
  const d = Math.hypot(vx, vy);
  if (d > R) {   // 멀리 끌면 조이스틱 중심이 따라와서 방향 바꾸기 쉬움
    TOUCH.ox += vx * (d - R) / d; TOUCH.oy += vy * (d - R) / d;
    vx = vx * R / d; vy = vy * R / d;
  }
  const m = Math.hypot(vx, vy) / R;
  if (m < 0.15) { TOUCH.x = TOUCH.y = 0; }           // 살짝 닿은 건 무시
  else { TOUCH.x = vx / R; TOUCH.y = vy / R; }
  drawStick(TOUCH.ox, TOUCH.oy, vx, vy, R);
});
const endTouch = e => {

  TOUCH.id = null; TOUCH.x = TOUCH.y = 0; stickEl.style.display = 'none';

canvas.addEventListener('pointercancel', endTouch);

    EVO_DEF.map(d => UPS.find(u => u.id === d.w).name + ' + ' + EVO_STAT[d.stat][0] + ' → <b>' + d.name + '</b>').join('<br>') + '</p>' +
    (IS_COARSE ? '' : '<p class="hint">P 또는 Esc 키로도 계속할 수 있어요</p>') + '</div>');

// 필살기 버튼 (폰)

let ultShown = false;

window.addEventListener('keyup', e => { if (e.target.closest && e.target.closest('input,textarea')) return; if (MOVE_KEYS.includes(e.code)) keys[e.code] = false; });
window.addEventListener('blur', () => { keys = {}; });

// =========================================================
//  업데이트
// =========================================================
function damageEnemy(e, d) {
  const c = curChar();
  if (c.crit && Math.random() < c.crit) d *= 2;   // 도적 패시브: 치명타
  e.hp -= d; e.flash = 0.1;
}

// 좌표에서 가장 가까운 살아있는 적
function nearestEnemy(x, y) {
  let best = null, bd = 1e9;
  for (const e of G.enemies) {
    if (e.hp <= 0) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function update(dt) {
  const p = G.player;
  G.time += dt;
  const dmgMul = (1 + B.up_dmg * G.dmgLv) * (1 + G.gear.dmg);
  const wdt = dt * (1 + G.gear.aspd);   // 장갑: 무기 재사용 시간이 더 빨리 흐름

  // --- 캐릭터 이동 (A=좌, S=하, D=우, W=상) ---
  let dx = ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0);
  let dy = ((keys.KeyS || keys.ArrowDown) ? 1 : 0) - ((keys.KeyW || keys.ArrowUp) ? 1 : 0);
  dx += TOUCH.x; dy += TOUCH.y;                       // 폰 가상 조이스틱
  const ml = Math.hypot(dx, dy);
  if (ml > 1) { dx /= ml; dy /= ml; }                 // 대각선도 같은 속도
  const wScale = Math.max(1, W / 960);   // 화면이 넓은 폰에서도 끝에서 끝까지 걸리는 시간이 PC(폭 960)와 같도록 속도 보정
  p.x = Math.max(p.r, Math.min(W - p.r, p.x + dx * p.speed * wScale * dt));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y + dy * p.speed * wScale * dt));
  p.invuln = Math.max(0, p.invuln - dt);

  // --- 적 생성 (시간이 지날수록 빨라짐) ---
  G.spawnT -= dt;
  const T = G.bossKills;   // 보스를 잡을 때마다 일반 몹이 한 단계씩 강해짐 (체력·공격·속도·크기·수가 늘고 색도 달라짐)
  const RKm = RANKS[G.rank || 0];   // 선택한 등급에 따른 적 강화
  if (G.spawnT <= 0 && G.enemies.length < Math.round((50 + 4 * T) * RKm.cap)) {
    G.spawnT = Math.max(0.2, (B.en_spawn - G.time / 150 - G.level * 0.02) * (1 - 0.06 * T) * RKm.spawn);
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = rand(0, W); y = -20; }
    else if (side === 1) { x = W + 20; y = rand(0, H); }
    else if (side === 2) { x = rand(0, W); y = H + 20; }
    else { x = -20; y = rand(0, H); }
    G.enemies.push({
      x, y, r: rand(12, 17) + 1.2 * T, flash: 0, orbCd: 0, tier: T,
      hp: (B.en_hp + G.time * B.en_hpTime + G.level * B.en_hpLevel) * (1 + B.en_hpTier * T) * RKm.hp,
      dmg: (B.en_dmg + B.en_dmgTier * T) * RKm.dmg,
      speed: Math.min(95 + 6 * T, (B.en_speed + rand(0, 20) + G.time * B.en_speedTime) * (1 + B.en_speedTier * T)) * RKm.spd,
    });
  }

  // --- 적 이동 및 접촉 피해 ---
  if (G.gear.regen > 0) p.hp = Math.min(p.maxHp, p.hp + G.gear.regen * dt);   // 목걸이: 체력 재생
  const armorPct = Math.min(B.up_armorCap, B.up_armor * G.armorLv + 0.04 * META.armor + G.gear.armor);
  for (const e of G.enemies) {
    const ex = p.x - e.x, ey = p.y - e.y, d = Math.hypot(ex, ey) || 1;
    const sp = e.slow > 0 ? e.speed * B.en_slow : e.speed;   // 얼음에 맞으면 느려짐
    e.slow = Math.max(0, (e.slow || 0) - dt);
    e.x += ex / d * sp * dt;
    e.y += ey / d * sp * dt;
    e.flash = Math.max(0, e.flash - dt);
    e.orbCd = Math.max(0, e.orbCd - dt);
    if (d < e.r + p.r && p.invuln <= 0 && state === 'play') {
      p.invuln = curChar().invuln || B.player_invuln;
      if (G.shieldReady) {            // 보호막이 한 번 막아줌 (진화하면 2번)
        G.shieldHits = (G.shieldHits ?? (G.evo.shield ? 2 : 1)) - 1;
        if (G.shieldHits <= 0) { G.shieldReady = false; G.shieldHits = undefined; }
        if (!G.shieldReady) G.shieldCd = Math.max(B.shield_cdMin, B.shield_cd - B.shield_cdLv * G.weapons.shield) * (G.evo.shield ? B.shield_evoCdMul : 1);
        G.texts.push({ x: p.x, y: p.y - 26, t: '막았다!', c: '#2a9df4', life: 0.9 });
        sfx('shield');
      } else {
        hurt(Math.max(1, Math.ceil((e.dmg || 5) * (1 - armorPct))));   // 방어도 적용
        sfx('hit');
      }
    }
  }

  // --- 무기 1: 마법탄 (가장 가까운 적에게 자동 발사 / 진화하면 마법포: 관통 5발) ---
  const wb = G.weapons.bolt, evoB = G.evo.bolt;
  if (wb > 0) {
    G.boltT -= wdt;
    if (G.boltT <= 0) {
      const near = nearestEnemy(p.x, p.y);
      if (near) {
        const cnt = evoB ? B.bolt_evoCnt : 1 + (wb >= 3 ? 1 : 0) + (wb >= 5 ? 1 : 0);
        const base = Math.atan2(near.y - p.y, near.x - p.x);
        for (let i = 0; i < cnt; i++) {
          const a = base + (i - (cnt - 1) / 2) * 0.2;
          G.shots.push({ x: p.x, y: p.y, vx: Math.cos(a) * B.bolt_speed, vy: Math.sin(a) * B.bolt_speed, dmg: B.bolt_dmg * dmgMul * (evoB ? B.bolt_evoMul : 1),
                         life: 1.6, pierce: evoB, hit: evoB ? new Set() : null, big: evoB });
        }
        G.boltT = evoB ? B.bolt_evoCd : Math.max(B.bolt_cdMin, B.bolt_cd - B.bolt_cdLv * (wb - 1));
      }
    }
  }
  for (const s of G.shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    for (const e of G.enemies) {
      if (e.hp <= 0 || Math.hypot(e.x - s.x, e.y - s.y) >= e.r + (s.big ? 9 : 6)) continue;
      if (s.pierce) { if (s.hit.has(e)) continue; s.hit.add(e); damageEnemy(e, s.dmg); }
      else { damageEnemy(e, s.dmg); s.life = 0; break; }
    }
  }
  G.shots = G.shots.filter(s => s.life > 0 && s.x > -30 && s.x < W + 30 && s.y > -30 && s.y < H + 30);

  // --- 무기 2: 회전 구슬 (진화하면 폭풍 구슬) ---
  const wo = G.weapons.orbit, evoO = G.evo.orbit;
  G.orbAngle += dt * (evoO ? 3.4 : 2.6);
  G.orbs = [];
  if (wo > 0) {
    const n = evoO ? B.orbit_evoCnt : wo + 1, rad = evoO ? B.orbit_evoRadius : B.orbit_radius + wo * B.orbit_radiusLv;
    for (let i = 0; i < n; i++) {
      const a = G.orbAngle + i * Math.PI * 2 / n;
      const ox = p.x + Math.cos(a) * rad, oy = p.y + Math.sin(a) * rad;
      G.orbs.push({ x: ox, y: oy });
      for (const e of G.enemies) {
        if (e.hp > 0 && e.orbCd <= 0 && Math.hypot(e.x - ox, e.y - oy) < e.r + 10) { damageEnemy(e, B.orbit_dmg * dmgMul * (evoO ? B.orbit_evoMul : 1)); e.orbCd = B.orbit_hitCd; }
      }
    }
  }

  // --- 무기 3: 충격파 (진화하면 대지진: 더 넓고 강하고 적을 느리게) ---
  const ww = G.weapons.wave, evoW = G.evo.wave;
  if (ww > 0) {
    G.waveT -= wdt;
    if (G.waveT <= 0) {
      const max = B.wave_radius + ww * B.wave_radiusLv + (evoW ? B.wave_evoRadius : 0);
      for (const e of G.enemies) {
        if (Math.hypot(e.x - p.x, e.y - p.y) < max + e.r) { damageEnemy(e, B.wave_dmg * dmgMul * (evoW ? B.wave_evoMul : 1)); if (evoW) e.slow = B.wave_evoSlow; }
      }
      G.waves.push({ x: p.x, y: p.y, r: 0, max, life: 0.4, t: 0 });
      sfx('boom');
      G.waveT = Math.max(0.5, B.wave_cd - B.wave_cdLv * ww);
    }
  }
  for (const w of G.waves) { w.t += dt; w.r = w.max * Math.min(1, w.t / w.life); }
  G.waves = G.waves.filter(w => w.t < w.life + 0.15);

  // --- 무기 4: 번개 (가장 가까운 적에서 시작해 근처 적들에게 튕김) ---
  const wl = G.weapons.lightning;
  if (wl > 0) {
    G.lightT -= wdt;
    let cur = G.lightT <= 0 ? nearestEnemy(p.x, p.y) : null;
    if (cur) {
      G.lightT = G.evo.lightning ? B.lightning_evoCd : Math.max(B.lightning_cdMin, B.lightning_cd - B.lightning_cdLv * wl);
      const hit = new Set(), pts = [{ x: p.x, y: p.y }];
      for (let n = B.lightning_bounce + wl + (G.evo.lightning ? B.lightning_evoBounce : 0); cur && n > 0; n--) {
        damageEnemy(cur, B.lightning_dmg * dmgMul * (G.evo.lightning ? B.lightning_evoMul : 1)); hit.add(cur); pts.push({ x: cur.x, y: cur.y });
        let best = null, bd = G.evo.lightning ? B.lightning_evoRange : B.lightning_range;
        for (const e of G.enemies) {
          if (e.hp <= 0 || hit.has(e)) continue;
          const d = Math.hypot(e.x - cur.x, e.y - cur.y);
          if (d < bd) { bd = d; best = e; }
        }
        cur = best;
      }
      G.arcs.push({ pts, life: 0.25 });
      sfx('zap');
    }
  }
  for (const ar of G.arcs) ar.life -= dt;
  G.arcs = G.arcs.filter(ar => ar.life > 0);

  // --- 무기 5: 부메랑 (나갔다가 플레이어에게 돌아오며 관통) ---
  const wm = G.weapons.boomerang;
  if (wm > 0) {
    G.boomT -= wdt;
    const near = G.boomT <= 0 ? nearestEnemy(p.x, p.y) : null;
    if (near) {
      G.boomT = G.evo.boomerang ? B.boom_evoCd : Math.max(B.boom_cdMin, B.boom_cd - B.boom_cdLv * wm);
      const cnt = G.evo.boomerang ? B.boom_evoCnt : 1 + (wm >= 3 ? 1 : 0) + (wm >= 5 ? 1 : 0);
      const base = Math.atan2(near.y - p.y, near.x - p.x);
      for (let i = 0; i < cnt; i++) {
        G.booms.push({ x: p.x, y: p.y, a: base + (i - (cnt - 1) / 2) * 0.55, t: 0, dur: 1.6, reach: B.boom_reach + B.boom_reachLv * wm + (G.evo.boomerang ? B.boom_evoReach : 0), hit: new Map() });
      }
    }
  }
  for (const b of G.booms) {
    b.t += dt;
    const dist = b.reach * Math.sin(Math.PI * Math.min(1, b.t / b.dur));   // 0 → 최대 → 0 (플레이어에게 되돌아옴)
    b.x = p.x + Math.cos(b.a) * dist; b.y = p.y + Math.sin(b.a) * dist;
    for (const e of G.enemies) {
      if (e.hp <= 0 || Math.hypot(e.x - b.x, e.y - b.y) >= e.r + 14) continue;
      if (b.t - (b.hit.get(e) ?? -9) >= 0.5) { b.hit.set(e, b.t); damageEnemy(e, B.boom_dmg * dmgMul * (G.evo.boomerang ? B.boom_evoMul : 1)); }
    }
  }
  G.booms = G.booms.filter(b => b.t < b.dur);

  // --- 무기 6: 불 장판 (가장 가까운 적 위치에 깔림, 밟고 있는 적에게 지속 피해) ---
  const wf = G.weapons.fire;
  if (wf > 0) {
    G.fireT -= wdt;
    const tgt = G.fireT <= 0 ? nearestEnemy(p.x, p.y) : null;
    if (tgt) {
      const fe = G.evo.fire;
      G.fireT = fe ? B.fire_evoCd : Math.max(B.fire_cdMin, B.fire_cd - B.fire_cdLv * wf);
      const spots = [tgt];
      if (fe && G.enemies.length > 1) spots.push(G.enemies[Math.floor(Math.random() * G.enemies.length)]);
      for (const t of spots) G.fires.push({ x: t.x, y: t.y, r: (B.fire_radius + B.fire_radiusLv * wf) * (fe ? B.fire_evoRadiusMul : 1), life: (B.fire_life + B.fire_lifeLv * wf) * (fe ? B.fire_evoLifeMul : 1), tick: 0, evo: fe });
    }
  }
  for (const f of G.fires) {
    f.life -= dt; f.tick -= dt;
    if (f.tick <= 0) {
      f.tick = 0.4;
      for (const e of G.enemies) if (e.hp > 0 && Math.hypot(e.x - f.x, e.y - f.y) < f.r + e.r) damageEnemy(e, (f.evo ? B.fire_evoDmg : B.fire_dmg) * dmgMul);
    }
  }
  G.fires = G.fires.filter(f => f.life > 0);

  // --- 무기 7: 얼음 파동 (주변 적을 느리게 + 약간의 피해) ---
  const wi = G.weapons.frost;
  if (wi > 0) {
    G.frostT -= wdt;
    if (G.frostT <= 0 && G.enemies.length) {
      G.frostT = Math.max(B.frost_cdMin, B.frost_cd - B.frost_cdLv * wi) * (G.evo.frost ? B.frost_evoCdMul : 1);
      const rad = B.frost_radius + B.frost_radiusLv * wi + (G.evo.frost ? B.frost_evoRadius : 0);
      for (const e of G.enemies) {
        if (Math.hypot(e.x - p.x, e.y - p.y) < rad + e.r) { damageEnemy(e, (G.evo.frost ? B.frost_evoDmg : B.frost_dmg) * dmgMul); e.slow = (B.frost_slow + B.frost_slowLv * wi) * (G.evo.frost ? B.frost_evoSlowMul : 1); }
      }
      G.novas.push({ x: p.x, y: p.y, max: rad, t: 0, life: 0.5 });
      sfx('frost');
    }
  }
  for (const n of G.novas) n.t += dt;
  G.novas = G.novas.filter(n => n.t < n.life);

  // --- 무기 8: 보호막 (한 번 막고, 시간이 지나면 다시 생김) ---
  if (G.weapons.shield > 0 && !G.shieldReady) {
    G.shieldCd -= dt;
    if (G.shieldCd <= 0) { G.shieldReady = true; G.texts.push({ x: p.x, y: p.y - 26, t: '보호막 재생!', c: '#2a9df4', life: 0.9 }); }
  }

  // --- 무기 9: 요정 (플레이어 곁을 돌며 가까운 적을 자동으로 쏨) ---
  const wp = G.weapons.pet;
  G.pets = [];
  if (wp > 0) {
    G.petAngle += dt * 1.6;
    const cnt = G.evo.pet ? B.pet_evoCnt : 1 + Math.floor((wp - 1) / 2);   // Lv1~2: 1마리, Lv3~4: 2마리, Lv5: 3마리
    for (let i = 0; i < cnt; i++) {
      const a = G.petAngle + i * Math.PI * 2 / cnt;
      G.pets.push({ x: p.x + Math.cos(a) * 42, y: p.y + Math.sin(a) * 42 });
    }
    G.petT -= wdt;
    if (G.petT <= 0 && G.enemies.length) {
      G.petT = G.evo.pet ? B.pet_evoCd : Math.max(B.pet_cdMin, B.pet_cd - B.pet_cdLv * wp);
      for (const pet of G.pets) {
        const t = nearestEnemy(pet.x, pet.y);
        if (!t) continue;
        const a = Math.atan2(t.y - pet.y, t.x - pet.x);
        G.shots.push({ x: pet.x, y: pet.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, dmg: (G.evo.pet ? B.pet_evoDmg : B.pet_dmg) * dmgMul, life: 1.4 });
      }
    }
  }

  // --- 쓰러진 적 정리 ---
  const before = G.enemies.length;
  const bossDead = G.enemies.filter(e => e.hp <= 0 && e.boss).length;
  G.enemies = G.enemies.filter(e => e.hp > 0);
  G.kills += before - G.enemies.length;
  if (before > G.enemies.length) sfx('kill');
  // 보스 처치 보상: 체력 30% 회복 + 20XP
  if (bossDead) {
    G.bossKills += bossDead;
    p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.3);
    G.xp += 20 * bossDead;
    G.texts.push({ x: p.x, y: p.y - 56, t: '👹 적들이 더 강해졌어요!', c: '#ff4d6d', life: 2 });
    const dropMsg = dropGear(bossDead);
    if (G.bossKills >= BOSS_GOAL) finishRun(true);   // 보스 5마리 처치 = 스테이지 클리어!
    else {
      sfx('bossdead');
      G.banner = { t: '🎉 보스 처치 (' + G.bossKills + '/' + BOSS_GOAL + ')  ' + dropMsg, life: 3 };
      if (G.xp >= G.xpNext && state === 'play') levelUp();
    }
  }

  // --- 떠오르는 텍스트 ---
  for (const t of G.texts) { t.y -= 30 * dt; t.life -= dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  G.flash = Math.max(0, G.flash - dt);
  if (G.banner) { G.banner.life -= dt; if (G.banner.life <= 0) G.banner = null; }

  if (state === 'play') updateQuestion(dt);
}

// ---------- 문제 타이머 / 패널티 / 구역 체크 ----------
function updateQuestion(dt) {
  const q = G.q, p = G.player;

  // 정답 처리 직후 잠깐 피드백을 보여준 뒤 다음 문제 출제
  if (q.done) {
    q.feedback -= dt;
    if (q.feedback <= 0) { nextQuestion(); sayQuestion(); }
    return;
  }

  const inCorrect = quadOf(p.x, p.y) === q.correct;

  if (q.timeLeft > 0) {
    // 5초 카운트다운 (이 동안에는 정답 구역을 지나가도 정답 처리되지 않음)
    q.timeLeft = Math.max(0, q.timeLeft - dt);
    // 마지막 3초: 1초마다 똑딱 소리
    const sec = Math.ceil(q.timeLeft);
    if (sec !== q.tickSec) { q.tickSec = sec; if (sec >= 1 && sec <= 3) sfx('tick'); }
    // 카운트가 0이 되는 순간 정답 구역에 서 있으면 정답, 아니면 시간 초과 경고음
    if (q.timeLeft <= 0) { if (inCorrect) solve(); else sfx('timeout'); }
  } else {
    // 시간 초과: 정답 구역에 도달할 때까지 1초당 1 피해
    q.wasOver = true;
    if (inCorrect) { solve(); return; }   // 정답 구역에 들어가면 즉시 해결
    q.over += dt;
    while (q.over >= 1 && state === 'play') {
      q.over -= 1;
      hurt(PENALTY_PER_SEC);
      sfx('penalty');
    }
  }
}

// =========================================================
//  렌더링
// =========================================================
function fitFont(txt, maxW, size, weight) {
  weight = weight || 'bold';
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  const w = ctx.measureText(txt).width;
  if (w > maxW) size = Math.floor(size * maxW / w);
  ctx.font = weight + ' ' + size + 'px ' + FONT;
}
function outlinedText(txt, x, y, fill, stroke) {
  ctx.lineJoin = 'round';
  ctx.lineWidth = 5;
  ctx.strokeStyle = stroke;
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(txt, x, y);
}

function render() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.save();
  ctx.translate(PANEL_W, HUD_H);             // 플레이 영역은 패널 오른쪽, 상단 바 아래에 그림
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();   // 영역 밖(화면 밖 적 등)이 패널에 번지지 않게
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const q = G.q, p = G.player;

  // 1) 4개 구역 배경 + 뜻(한글)
  for (let i = 0; i < 4; i++) {
    const x = (i % 2) * W / 2, y = Math.floor(i / 2) * H / 2;
    ctx.fillStyle = QUAD_COLORS[i];
    ctx.fillRect(x, y, W / 2, H / 2);
    if (state !== 'title' && quadOf(p.x, p.y) === i) { ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(x, y, W / 2, H / 2); } // 현재 서 있는 구역
    if (q.done && q.correct === i) { ctx.fillStyle = 'rgba(40,200,90,' + (0.2 + 0.4 * Math.min(1, q.feedback / q.fbMax)) + ')'; ctx.fillRect(x, y, W / 2, H / 2); }
    fitFont(q.labels[i], W / 2 - 80, 54);
    ctx.fillStyle = '#2d2d4a';
    ctx.fillText(q.labels[i], x + W / 4, y + H / 4);
  }
  // 구역 구분선
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(W / 2 - 3, 0, 6, H);
  ctx.fillRect(0, H / 2 - 3, W, 6);

  // 2) 가운데 원 + 타이머 링
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 84, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.93)'; ctx.fill();
  const ratio = q.done ? 1 : q.timeLeft / QUESTION_TIME;
  const over = !q.done && q.timeLeft <= 0;
  ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.strokeStyle = '#ddd';
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 84, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = q.done ? '#2ecc71' : over ? '#ff3b3b' : ratio > 0.5 ? '#3cc35a' : ratio > 0.25 ? '#ffa500' : '#ff4d4d';
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 84, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (over ? 1 : ratio)); ctx.stroke();

  // 3) 충격파
  for (const w of G.waves) {
    const a = Math.max(0, 1 - Math.max(0, w.t - w.life) / 0.15) * (1 - w.r / w.max * 0.5);
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(80,170,255,' + a + ')';
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke();
  }

  // 3-2) 불 장판 / 얼음 파동 (적 아래에 깔림)
  for (const f of G.fires) {
    const a = Math.min(1, f.life / 0.5);
    ctx.globalAlpha = 0.5 * a;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fillStyle = '#ff7a1a'; ctx.fill();
    ctx.globalAlpha = 0.85 * a; ctx.lineWidth = 3; ctx.strokeStyle = '#ffd23f'; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (const n of G.novas) {
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(120,210,255,' + Math.max(0, 1 - n.t / n.life) + ')';
    ctx.beginPath(); ctx.arc(n.x, n.y, n.max * Math.min(1, n.t / (n.life * 0.6)), 0, Math.PI * 2); ctx.stroke();
  }

  // 4) 적: 단계(보스를 잡은 수)가 올라갈수록 색이 바뀌고 뿔이 늘어남
  const MOB_FILL = ['#e8505b', '#ff9f43', '#e84393', '#9b59e6', '#2d3436'], MOB_LINE = ['#8c1d2b', '#a85a00', '#8a1f5e', '#5b2a8c', '#000'];
  const BOSS_FILL = Array.from({ length: 10 }, (_, i) => 'hsl(' + ((275 + i * 38) % 360) + ' 62% 44%)'), BOSS_LINE = Array.from({ length: 10 }, (_, i) => 'hsl(' + ((275 + i * 38) % 360) + ' 60% 18%)');
  for (const e of G.enemies) {
    const tr = e.tier || 0, t = Math.min(4, Math.ceil(tr / 2)), bi = Math.min(9, Math.max(0, (e.tier || 1) - 1));   // t: 몹 모양 단계(0~4), tr: 실제 단계
    if (e.boss) {   // 보스 오라: 보스 번호가 높을수록 크고 진하게 번쩍
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 8 + 3 * Math.sin(G.time * 6), 0, Math.PI * 2);
      ctx.strokeStyle = BOSS_FILL[bi]; ctx.globalAlpha = Math.min(0.7, 0.25 + 0.05 * bi); ctx.lineWidth = Math.min(16, 6 + bi); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (t >= 3) {
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4, 0, Math.PI * 2);
      ctx.strokeStyle = MOB_FILL[t]; ctx.globalAlpha = 0.45; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
    }
    const nh = Math.min(5, tr);
    if (!e.boss) for (let k = 0; k < nh; k++) {   // 일반 몹 뿔(가시): 단계만큼
      const a = -Math.PI / 2 + (k - (nh - 1) / 2) * 0.6;
      ctx.beginPath();
      ctx.moveTo(e.x + Math.cos(a - 0.25) * e.r, e.y + Math.sin(a - 0.25) * e.r);
      ctx.lineTo(e.x + Math.cos(a) * (e.r + 8), e.y + Math.sin(a) * (e.r + 8));
      ctx.lineTo(e.x + Math.cos(a + 0.25) * e.r, e.y + Math.sin(a + 0.25) * e.r);
      ctx.fillStyle = MOB_LINE[t]; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    const fill = e.boss ? BOSS_FILL[bi] : MOB_FILL[t];
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : (e.slow > 0 ? (e.boss ? '#7a8fe0' : '#8fd0ff') : fill); ctx.fill();
    ctx.lineWidth = e.boss ? 4 : 2; ctx.strokeStyle = e.boss ? BOSS_LINE[bi] : MOB_LINE[t]; ctx.stroke();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(e.x - e.r * 0.35, e.y - 2, 2.5, 0, 7); ctx.arc(e.x + e.r * 0.35, e.y - 2, 2.5, 0, 7); ctx.fill();
    if (!e.boss && tr >= 2) {   // 화난 눈썹
      ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(e.x - e.r * 0.6, e.y - 9); ctx.lineTo(e.x - e.r * 0.15, e.y - 5);
      ctx.moveTo(e.x + e.r * 0.6, e.y - 9); ctx.lineTo(e.x + e.r * 0.15, e.y - 5); ctx.stroke();
    }
    if (e.boss) {
      // 뿔(보스 번호만큼 늘어남) + 체력바 + 번호
      ctx.fillStyle = '#ffd23f';
      const horns = Math.min(6, 2 + Math.floor((e.tier || 1) / 2));
      for (let k = 0; k < horns; k++) {
        const hx = e.x + (k - (horns - 1) / 2) * 15;
        ctx.beginPath(); ctx.moveTo(hx - 8, e.y - e.r + 8); ctx.lineTo(hx, e.y - e.r - 16); ctx.lineTo(hx + 8, e.y - e.r + 8); ctx.fill();
      }
      ctx.fillStyle = '#333'; ctx.fillRect(e.x - 40, e.y - e.r - 34, 80, 8);
      ctx.fillStyle = '#ff4d6d'; ctx.fillRect(e.x - 40, e.y - e.r - 34, 80 * Math.max(0, e.hp) / e.maxHp, 8);
      ctx.font = 'bold 13px ' + FONT; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText((e.tier >= BOSS_GOAL ? '최종' : '보스 ' + e.tier), e.x, e.y + 2);
    }
  }

  // 5) 회전 구슬 / 마법탄
  for (const o of (G.orbs || [])) {
    ctx.beginPath(); ctx.arc(o.x, o.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#b36bff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  for (const s of G.shots) {
    ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#e08a00'; ctx.stroke();
  }
  // 5-2) 번개 / 부메랑 / 요정
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const ar of G.arcs) {
    ctx.globalAlpha = Math.min(1, ar.life / 0.15);
    for (const [w, c] of [[8, 'rgba(255,235,90,.55)'], [3, '#ffffff']]) {
      ctx.lineWidth = w; ctx.strokeStyle = c;
      ctx.beginPath(); ar.pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  for (const b of G.booms) {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.t * 14);
    ctx.fillStyle = '#6be3a1'; ctx.strokeStyle = '#1f7a52'; ctx.lineWidth = 3;
    ctx.fillRect(-17, -4, 34, 8); ctx.strokeRect(-17, -4, 34, 8);
    ctx.fillRect(-4, -17, 8, 34); ctx.strokeRect(-4, -17, 8, 34);
    ctx.restore();
  }
  for (const pet of G.pets) {
    ctx.beginPath(); ctx.arc(pet.x, pet.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#ff9ad5'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.ellipse(pet.x - 9, pet.y - 5, 6, 3, -0.5, 0, 7); ctx.ellipse(pet.x + 9, pet.y - 5, 6, 3, 0.5, 0, 7); ctx.fill();
  }

  // 6) 플레이어 (+ 정답 구역 체류 진행 링)
  ctx.globalAlpha = (p.invuln > 0 && Math.floor(G.time * 20) % 2) ? 0.4 : 1;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fillStyle = curChar().color; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(p.x - 5, p.y - 3, 4, 0, 7); ctx.arc(p.x + 5, p.y - 3, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(p.x - 5, p.y - 3, 1.8, 0, 7); ctx.arc(p.x + 5, p.y - 3, 1.8, 0, 7); ctx.fill();
  ctx.font = '16px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(curChar().icon, p.x, p.y - p.r - 9);   // 머리 위 캐릭터 표시
  ctx.globalAlpha = 1;

  // 6-2) 보호막
  if (G.weapons.shield > 0) {
    ctx.beginPath(); ctx.arc(p.x, p.y, 28, 0, Math.PI * 2);
    if (G.shieldReady) { ctx.fillStyle = 'rgba(120,220,255,.18)'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(80,190,255,.9)'; ctx.stroke(); }
    else { ctx.lineWidth = 2; ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(80,190,255,.4)'; ctx.stroke(); ctx.setLineDash([]); }
  }

  // 7) 가운데 영어 단어 + 카운트다운 숫자 (캐릭터/적 위에 표시해서 항상 보이게)
  fitFont(q.top, 130, q.done ? 30 : 36);
  outlinedText(q.top, W / 2, q.done ? H / 2 - 20 : H / 2 - 12, '#1d2b64', '#fff');
  if (q.done) {
    // 정답 확인: 영어 단어 아래에 정답 뜻을 크게 표시
    fitFont(q.bottom, 130, 30);
    outlinedText(q.bottom, W / 2, H / 2 + 20, '#1ba54a', '#fff');
  } else if (q.timeLeft > 0) {
    ctx.font = 'bold 34px ' + FONT; outlinedText(String(Math.ceil(q.timeLeft)), W / 2, H / 2 + 30, ratio > 0.4 ? '#2c8a3d' : '#e03030', '#fff');
  } else {
    ctx.font = 'bold 18px ' + FONT; outlinedText('-1HP/초!', W / 2, H / 2 + 30, '#e02020', '#fff');
  }

  // 8) 떠오르는 텍스트
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, t.life / 0.4);
    ctx.font = 'bold 20px ' + FONT;
    outlinedText(t.t, t.x, t.y, t.c, '#fff');
  }
  ctx.globalAlpha = 1;
  if (G.banner) {
    ctx.globalAlpha = Math.min(1, G.banner.life / 0.5);
    let fs = 40; ctx.font = 'bold ' + fs + 'px ' + FONT;
    while (fs > 14 && ctx.measureText(G.banner.t).width > W - 30) { fs -= 2; ctx.font = 'bold ' + fs + 'px ' + FONT; }   // 너무 길면 글자를 줄여 화면 안에 맞춤
    outlinedText(G.banner.t, W / 2, 104, '#d6246e', '#fff');
    ctx.globalAlpha = 1;
  }

  // 필살기 화면 번쩍
  if (G.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.85, G.flash * 1.4) + ')'; ctx.fillRect(0, 0, W, H); }

  // 9) 시간 초과 경고: 화면 테두리 붉게 깜빡임
  if (over && state === 'play') {
    ctx.lineWidth = 14;
    ctx.strokeStyle = 'rgba(255,40,40,' + (0.35 + 0.3 * Math.sin(G.time * 8)) + ')';
    ctx.strokeRect(7, 7, W - 14, H - 14);
  }

  ctx.restore();
  ctx.save();
  ctx.translate(PANEL_W, 0);                 // 상단 바 영역 (4분면 화면 위)

  // 10) HUD: HP바, XP바, 레벨, 정답 수, 시간
  ctx.fillStyle = '#2d2d4f'; ctx.fillRect(0, 0, W, HUD_H);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, HUD_H - 3, W, 3);
  ctx.fillStyle = '#444'; ctx.fillRect(16, 9, 300, 20);
  ctx.fillStyle = '#ff4d6d'; ctx.fillRect(16, 9, 300 * p.hp / p.maxHp, 20);
  ctx.font = 'bold ' + Math.round(14 * UI) + 'px ' + FONT; ctx.fillStyle = '#fff';
  ctx.textAlign = 'left'; ctx.fillText('HP ' + Math.ceil(p.hp) + ' / ' + p.maxHp, 22, 20);
  const xh = IS_COARSE ? 16 : 12;
  ctx.fillStyle = '#444'; ctx.fillRect(16, 34, 300, xh);
  ctx.fillStyle = '#4dd0ff'; ctx.fillRect(16, 34, 300 * G.xp / G.xpNext, xh);
  ctx.font = 'bold ' + Math.round(11 * UI) + 'px ' + FONT; ctx.fillStyle = '#fff'; ctx.fillText('XP ' + G.xp + ' / ' + G.xpNext, 22, 34 + xh / 2 + 0.5);
  ctx.font = 'bold 26px ' + FONT; ctx.fillStyle = '#ffd23f'; ctx.fillText('Lv.' + G.level, 332, 30);
  { // 필살기 게이지 + 연속 정답 콤보
    const gx = 420, gw = 230, ready = G.gauge >= 100;
    ctx.fillStyle = '#444'; ctx.fillRect(gx, 9, gw, 20);
    ctx.fillStyle = ready ? (Math.floor(G.time * 6) % 2 ? '#ffd23f' : '#ff9f1c') : '#a86bff';
    ctx.fillRect(gx, 9, gw * Math.min(1, G.gauge / 100), 20);
    ctx.textAlign = 'center'; ctx.font = 'bold ' + Math.round(13 * UI) + 'px ' + FONT;
    ctx.fillStyle = ready ? '#3a2a00' : '#fff';
    ctx.fillText(ready ? (IS_COARSE ? '⚡ 💣 버튼! 단어 폭탄' : '⚡ SPACE! 단어 폭탄') : '필살기 ' + Math.floor(G.gauge) + '%', gx + gw / 2, 20);
    ctx.fillStyle = '#fff';
    ctx.fillText(G.combo > 0 ? '🔥 연속 정답 ' + G.combo + '콤보' : '제때 맞혀 연속 정답을 쌓아요', gx + gw / 2, 41);
  }
  ctx.textAlign = 'right'; ctx.font = 'bold 17px ' + FONT; ctx.fillStyle = '#fff';
  ctx.fillText(RANKS[G.rank || 0].icon + ' ' + RANKS[G.rank || 0].name + '  |  정답 ' + G.correct + '개  |  보스 ' + G.bossKills + '/' + BOSS_GOAL + '  |  ' + fmtTime(G.time), W - 16, 28);
  ctx.textAlign = 'center';

  ctx.restore();

  // 11) 좌측 '내 능력' 패널 (4분면 화면과 별도 영역)
  drawSidebar();
  drawRecipes();
}

// '내 능력' 패널 하단: 가진 무기의 진화 조합과 진행 상황 (다 외우지 않아도 되게)
const recipeRows = () => (!G ? [] : EVO_DEF.filter(d => G.weapons[d.w] > 0 && !G.evo[d.w]));
function drawRecipes() {
  const rows = recipeRows();
  if (!rows.length || state === 'title') return;
  const lh = Math.round(17 * Math.min(UI, 1.3)), bw = PANEL_W - 26, bh = lh * rows.length + 22, x = 10, y = CH - 58 - bh;
  ctx.save();
  ctx.fillStyle = 'rgba(255,210,63,.1)'; ctx.fillRect(x, y, bw, bh);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 12px ' + FONT; ctx.fillStyle = '#ffd23f'; ctx.fillText('✨ 진화 조합', x + 6, y + 11);
  rows.forEach((d, i) => {
    const [sn, sget] = EVO_STAT[d.stat], wl = Math.min(5, G.weapons[d.w]), sl = Math.min(3, sget());
    const t = UPS.find(u => u.id === d.w).name + ' ' + wl + '/5 +' + sn + ' ' + sl + '/3';
    let fs = Math.round(12 * Math.min(UI, 1.3)); ctx.font = fs + 'px ' + FONT;
    while (ctx.measureText(t).width > bw - 10 && fs > 8) { fs--; ctx.font = fs + 'px ' + FONT; }
    ctx.fillStyle = (wl >= 5 && sl >= 3) ? '#7CFC7C' : '#fff';
    ctx.fillText(t, x + 6, y + 22 + lh * i + lh / 2);
  });
  ctx.restore();
}
function drawSidebar() {
  ctx.fillStyle = '#23233f'; ctx.fillRect(0, 0, PANEL_W, CH);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(PANEL_W - 3, 0, 3, CH);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center'; ctx.font = 'bold 20px ' + FONT; ctx.fillStyle = '#ffd23f';
  ctx.fillText('내 능력', PANEL_W / 2 + 34, 30);   // 왼쪽 위 소리/전체화면 버튼과 안 겹치게 오른쪽으로
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(16, 52, PANEL_W - 38, 2);

  const SHORT = { bolt: '마법탄', orbit: '회전 구슬', wave: '충격파', lightning: '번개', boomerang: '부메랑', fire: '불 장판', frost: '얼음 파동', shield: '보호막', pet: '요정',
                  dmg: '공격력', armor: '방어도', hp: '최대 체력', speed: '이동 속도' };
  const owned = UPS.filter(u => u.max !== Infinity && !u.evo && u.lv() > 0);
  const recH = recipeRows().length ? recipeRows().length * Math.round(17 * Math.min(UI, 1.3)) + 28 : 0;   // 하단 진화 조합 칸 높이
  const rowH = Math.min(52, Math.floor((CH - 84 - 56 - recH) / Math.max(1, owned.length)));   // 능력이 많아지면 줄 간격을 줄임
  owned.forEach((u, i) => {
    const ry = 70 + i * rowH;
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(10, ry, PANEL_W - 26, rowH - 8);
    ctx.textAlign = 'left';
    ctx.font = '24px ' + FONT; ctx.fillStyle = '#fff'; ctx.fillText(u.icon, 18, ry + (rowH - 8) / 2);
    ctx.font = 'bold ' + Math.round(15 * UI) + 'px ' + FONT; const evolved = G.evo[u.id];
    ctx.fillText(evolved ? '★ ' + EVO_NAME[u.id] : SHORT[u.id], 52, ry + 13);
    // 레벨 표시 칸(최대 레벨 기준으로 채워진 점)
    for (let k = 0; k < u.max; k++) {
      ctx.fillStyle = k < u.lv() ? (evolved ? '#ffd23f' : '#4dd0ff') : 'rgba(255,255,255,.2)';
      ctx.fillRect(52 + k * 12, ry + 27, 9, 7);
    }
  });
  ctx.textAlign = 'center';
}

// ---------- 메인 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);  // 탭 전환 등으로 시간이 튀는 것 방지
  last = now;
  if (state === 'play') update(dt);   // 레벨업 창/게임오버 때는 업데이트 중지(=일시정지)
  render();
  syncTouchUI();
  requestAnimationFrame(loop);
}

ADM = loadAdm();
fitLayout();
newGame();       // 타이틀 화면 뒤에 보일 초기 화면
showTitle();
SYNC_READY = true; syncAuto();   // 로그인되어 있으면 서버와 맞춤
requestAnimationFrame(loop);
</script>
</body>
